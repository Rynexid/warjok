services:
  postgres:
    image: postgres:16-alpine
    container_name: warjok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: warjok
      POSTGRES_PASSWORD: warjok
      POSTGRES_DB: warjok
    ports:
      - "5432:5432"
    volumes:
      - warjok_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warjok -d warjok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: warjok-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://warjok:warjok@postgres:5432/warjok
      BETTER_AUTH_SECRET: change-me-in-production
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: warjok-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  warjok_pg_data:
